<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>ChatGPT Quota</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-state="loading">
    <main class="widget">
      <header class="titlebar">
        <div class="brand">
          <span id="trafficLight" class="traffic-light loading" role="img" aria-label="读取中"></span>
          <div class="brand-copy">
            <span id="brandName" class="brand-name">ChatGPT Quota</span>
            <span id="stateText" class="brand-state">读取中</span>
          </div>
        </div>
        <div class="window-actions">
          <button id="settingsBtn" class="icon-button more-button" title="更多" aria-label="更多" aria-expanded="false">···</button>
          <button id="minimizeBtn" class="icon-button" title="隐藏" aria-label="隐藏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button id="closeBtn" class="icon-button danger" title="退出" aria-label="退出">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </header>

      <aside id="settingsPanel" class="settings-panel" hidden>
        <div class="settings-heading">
          <strong id="settingsTitle">更多</strong>
          <span id="settingsHint">快捷操作与显示设置</span>
        </div>
        <div class="menu-actions">
          <button id="refreshBtn" class="panel-action" type="button">刷新</button>
          <button id="pinBtn" class="panel-action active" type="button">取消置顶</button>
          <button id="langBtn" class="panel-action" type="button">English</button>
        </div>
        <button id="lockPositionBtn" class="panel-action lock-action" type="button" aria-pressed="false">Lock position</button>
        <label class="setting-row">
          <span id="showFiveHourLabel">5小时额度</span>
          <input id="showFiveHourInput" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span id="showWeeklyLabel">7天额度</span>
          <input id="showWeeklyInput" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span id="showPlanLabel">显示计划卡片</span>
          <input id="showPlanInput" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span id="showTodayTokensLabel">显示今日 Token 卡片</span>
          <input id="showTodayTokensInput" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span id="minimalModeLabel">最简模式</span>
          <input id="minimalModeInput" type="checkbox" />
        </label>
        <label class="setting-row setting-select">
          <span id="meterOneSettingLabel">Meter 1 shows</span>
          <select id="meterOneSourceInput">
            <option value="none" data-i18n-key="none">None</option>
            <option value="weekly" data-i18n-key="showWeekly">7-day quota</option>
            <option value="fiveHour" data-i18n-key="showFiveHour">5-hour quota</option>
          </select>
        </label>
        <label class="setting-row setting-select">
          <span id="meterTwoSettingLabel">Meter 2 shows</span>
          <select id="meterTwoSourceInput">
            <option value="none" data-i18n-key="none">None</option>
            <option value="weekly" data-i18n-key="showWeekly">7-day quota</option>
            <option value="fiveHour" data-i18n-key="showFiveHour">5-hour quota</option>
          </select>
        </label>
        <label class="setting-row setting-select">
          <span id="themeLabel">Theme</span>
          <select id="themeInput">
            <option value="dark" data-i18n-key="darkTheme">Dark</option>
            <option value="light" data-i18n-key="lightTheme">Light</option>
          </select>
        </label>
        <label class="setting-row setting-select">
          <span id="orientationLabel">Bar orientation</span>
          <select id="orientationInput">
            <option value="vertical" data-i18n-key="vertical">Vertical</option>
            <option value="horizontal" data-i18n-key="horizontal">Horizontal</option>
          </select>
        </label>
        <label class="setting-row transparency-setting">
          <span id="transparencyLabel">Transparency</span>
          <input id="transparencyInput" type="range" min="0" max="100" step="5" value="0" />
          <output id="transparencyValue">0%</output>
        </label>
      </aside>

      <section class="content">
        <div class="liquid-meters">
          <div id="meterOne" class="liquid-meter" role="img" aria-label="5小时剩余">
            <div class="glass-rim"></div>
            <div id="meterOneFill" class="liquid-fill">
              <div class="wave wave-one"></div>
              <div class="wave wave-two"></div>
            </div>
            <div class="shine"></div>
            <div class="meter-copy">
              <span id="meterOneLabel" class="meter-window-label">5小时</span>
              <strong id="meterOnePercent">--%</strong>
              <span id="meterOneReset" class="meter-reset">--</span>
            </div>
          </div>
          <div id="meterTwo" class="liquid-meter" role="img" aria-label="7天剩余">
            <div class="glass-rim"></div>
            <div id="meterTwoFill" class="liquid-fill">
              <div class="wave wave-one"></div>
              <div class="wave wave-two"></div>
            </div>
            <div class="shine"></div>
            <div class="meter-copy">
              <span id="meterTwoLabel" class="meter-window-label">7天</span>
              <strong id="meterTwoPercent">--%</strong>
              <span id="meterTwoReset" class="meter-reset">--</span>
            </div>
          </div>
        </div>

        <div class="quota-panel">
          <div id="fiveHourCard" class="quota-card primary">
            <span id="fiveHourLabel">5小时</span>
            <strong id="fiveHourText">--</strong>
          </div>
          <div id="weeklyCard" class="quota-card primary">
            <span id="weeklyLabel">7天</span>
            <strong id="weeklyText">--</strong>
          </div>
          <div class="quota-card slim">
            <span id="planLabel">计划</span>
            <strong id="planText">--</strong>
          </div>
          <div class="quota-card token-card">
            <span id="todayTokenLabel">今日 Token</span>
            <strong id="todayTokenText">--</strong>
          </div>
        </div>
      </section>

      <footer class="status">
        <span id="statusDot" class="status-dot loading" role="img" aria-label="正在刷新"></span>
        <span id="statusText">正在读取额度...</span>
      </footer>
    </main>

    <script src="./widget-logic.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
